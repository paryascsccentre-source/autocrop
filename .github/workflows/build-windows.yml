name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --name PARYAS-AutoCrop --collect-all cv2 --collect-all PySide6 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PARYAS-AutoCrop-Windows
          path: dist/PARYAS-AutoCrop/
